#Placeholders：
#{0}: nome do proxy
#{1}: nome do servidor
#{2}: nome do jogador
#{3}: mensagem do chat
#Você pode colorir com o caractére：“§”

#Fomato do chat padrão:
#Uso：qu_an.chat.message.chat.default=<chat_format>

#Formato do chat local:
#Usa o chat padrão quando não preenchido.
#Uso：qu_an.chat.message.chat.server.<server_id>=<chat_format>
#Exemplos：
# qu_an.chat.message.chat.server.lobby=§8[§r{0}§8|§r{1}]§r<{2}§r> {3}
#Um exemplo que ignora o nome do servidor：
# qu_an.chat.message.chat.server.survival=§8[§r{0}§8]§r<{2}§r> {3}

#Nomes dos servidor:
#Usa o ID do servidor se não for preenchido.
#Uso：qu_an.chat.server.name.<server_id>=<server_name>
#Exemplos：
# qu_an.chat.server.name.lobby=Lobby
# qu_an.chat.server.name.survival=§aSurvival
