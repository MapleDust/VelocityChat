qu_an.chat.command.help.reload="/vchat reload": Reload.
qu_an.chat.command.help.channel="/vchat channel": Show current channel.
qu_an.chat.command.help.channel.global="/vchat global" or "/{0}": Switch to global chat, reset after leaving the game.
qu_an.chat.command.help.channel.local="/vchat local" or "/{0}": Switch to local chat, reset after leaving the game.
qu_an.chat.command.help.global="/vchat global <message>" or "/{0} <message>", or a message starts with "{1}": Send a global message.
qu_an.chat.command.help.local="/vchat local <message>" or "/{0} <message>", or a message starts with "{1}": Send a local message to current server.
qu_an.chat.command.help.broadcast="/broadcast <message>" or "/{0} <message>": Broadcast.
qu_an.chat.command.help.notify="/vchat notify <server> <message>" or "/{0} <server> <message>": Send a notice to the target server.
qu_an.chat.command.help.tell="/vchat tell <player> <message>" or "/{0} <player> <message>": Send a whisper to the target player.
qu_an.chat.command.help.tellconsole="/vchat broadcast <message>" or "/{0} <message>": Send a whisper to console.
