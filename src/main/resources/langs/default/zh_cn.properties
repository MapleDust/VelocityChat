qu_an.chat.command.help=VelocityChat 使用指南：
qu_an.chat.command.help.formattable_chat=全局聊天支持 MiniMessage 格式的颜色、修饰和重置代码
qu_an.chat.command.help.reload=“/vchat reload”：重载
qu_an.chat.command.help.player.channel=“/vchat channel”获取当前聊天频道
qu_an.chat.command.help.player.channel.global=“/vchat global”或“/{0}”：切换到全局聊天，退出后重置
qu_an.chat.command.help.player.channel.local=“/vchat local”或“/{0}”：切换到子服务器聊天，退出后重置
qu_an.chat.command.help.player.global=“/vchat global <聊天消息>”或“/{0} <聊天消息>”，或以“{1}”为聊天消息的开头：发送全局聊天消息
qu_an.chat.command.help.player.local=“/vchat local <聊天消息>”或“/{0} <聊天消息>”，或以“{1}”为聊天消息的开头：向所在子服务器发送聊天消息
qu_an.chat.command.help.player.tellconsole=“/vchat tellconsole <私信消息>”或“/{0} <私信消息>”：向后台发送私信
qu_an.chat.command.help.console.broadcast=“/vchat broadcast <广播消息>”或“/{0} <广播消息>”：发送广播
qu_an.chat.command.help.console.notify=“/vchat notify <子服务器ID> <通知消息>”或“/{0} <子服务器ID> <通知消息>”：向子服务器发送通知
qu_an.chat.command.help.console.tell=“/vchat tell <玩家ID> <私信消息>”或“/{0} <玩家ID> <私信消息>”：向玩家发送私信
